<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Sudarshan XII</title>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
:root{
  --bg:#fbfbfd; --alt:#f5f5f7; --card:#ffffff;
  --ink:#1d1d1f; --muted:#6e6e73; --hair:rgba(0,0,0,.08);
  --accent:#0071e3; --accent-hover:#0077ed; --accent-soft:rgba(0,113,227,.10);
  --shadow:0 2px 6px rgba(0,0,0,.04), 0 22px 44px -22px rgba(0,0,0,.20);
  --shadow-hover:0 4px 12px rgba(0,0,0,.06), 0 34px 60px -24px rgba(0,0,0,.30);
  --cshadow:0 1px 3px rgba(0,0,0,.03); --alt-a:rgba(244,244,246,.78); --glass:rgba(255,255,255,.74);
  --hover:rgba(0,0,0,.028); --item-hover:rgba(0,113,227,.06); --nest:linear-gradient(90deg,rgba(0,0,0,.02),transparent 60%);
  --chev:#b0b0b5; --focus:rgba(0,113,227,.55); --chip:rgba(0,0,0,.06);
  --sh1:#ececf0; --sh2:#f6f6f9; --h1a:#1d1d1f; --h1b:#58585d;
  --b1:rgba(0,113,227,.16); --b2:rgba(175,82,222,.13); --b3:rgba(255,159,10,.14);
  --ease:cubic-bezier(.22,.8,.24,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --alt:#101012; --card:#1c1c1e;
    --ink:#f5f5f7; --muted:#a1a1a6; --hair:rgba(255,255,255,.13);
    --accent:#2997ff; --accent-hover:#40a4ff; --accent-soft:rgba(41,151,255,.16);
    --shadow:0 2px 6px rgba(0,0,0,.4), 0 22px 44px -22px rgba(0,0,0,.8);
    --shadow-hover:0 4px 12px rgba(0,0,0,.5), 0 34px 60px -24px rgba(0,0,0,.95);
    --cshadow:0 1px 3px rgba(0,0,0,.4); --alt-a:rgba(18,18,20,.78);
    --hover:rgba(255,255,255,.05); --item-hover:rgba(41,151,255,.13); --nest:linear-gradient(90deg,rgba(255,255,255,.03),transparent 60%);
    --chev:#6e6e73; --focus:rgba(41,151,255,.65); --chip:rgba(255,255,255,.11);
    --sh1:#1c1c1e; --sh2:#2c2c2e; --h1a:#f5f5f7; --h1b:#8e8e93;
    --b1:rgba(41,151,255,.22); --b2:rgba(175,82,222,.18); --b3:rgba(255,159,10,.10);
    color-scheme:dark; --glass:rgba(44,44,46,.74);
  }
}
:root[data-theme="dark"]{
    --bg:#000000; --alt:#101012; --card:#1c1c1e;
    --ink:#f5f5f7; --muted:#a1a1a6; --hair:rgba(255,255,255,.13);
    --accent:#2997ff; --accent-hover:#40a4ff; --accent-soft:rgba(41,151,255,.16);
    --shadow:0 2px 6px rgba(0,0,0,.4), 0 22px 44px -22px rgba(0,0,0,.8);
    --shadow-hover:0 4px 12px rgba(0,0,0,.5), 0 34px 60px -24px rgba(0,0,0,.95);
    --cshadow:0 1px 3px rgba(0,0,0,.4); --alt-a:rgba(18,18,20,.78);
    --hover:rgba(255,255,255,.05); --item-hover:rgba(41,151,255,.13); --nest:linear-gradient(90deg,rgba(255,255,255,.03),transparent 60%);
    --chev:#6e6e73; --focus:rgba(41,151,255,.65); --chip:rgba(255,255,255,.11);
    --sh1:#1c1c1e; --sh2:#2c2c2e; --h1a:#f5f5f7; --h1b:#8e8e93;
    --b1:rgba(41,151,255,.22); --b2:rgba(175,82,222,.18); --b3:rgba(255,159,10,.10);
    color-scheme:dark; --glass:rgba(44,44,46,.74);
}
*{box-sizing:border-box}
html{background:var(--bg); scroll-behavior:smooth; scroll-padding-top:20px; -webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.47;
  letter-spacing:-.011em; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
a{color:inherit}
.wrap{max-width:980px; margin:0 auto; padding:0 max(22px,env(safe-area-inset-left,0px)) 0 max(22px,env(safe-area-inset-right,0px))}

/* ---------- hero ---------- */
.hero{position:relative; isolation:isolate; overflow:hidden; text-align:center; padding:calc(110px + env(safe-area-inset-top,0px)) 0 100px}
.hero::before{
  content:""; position:absolute; z-index:-1; left:-10%; right:-10%; top:-10%; height:115%; filter:blur(36px);
  background:
    radial-gradient(38% 42% at 28% 38%, var(--b1), transparent 72%),
    radial-gradient(34% 38% at 74% 32%, var(--b2), transparent 72%),
    radial-gradient(30% 34% at 56% 74%, var(--b3), transparent 72%);
  animation:drift 18s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(-2%,0,0) scale(1)} to{transform:translate3d(2%,3%,0) scale(1.08)}}
.hero-inner{will-change:transform,opacity}
h1{
  font-size:clamp(2.7rem,10.5vw,6rem); line-height:1.02; letter-spacing:-.045em; font-weight:700; margin:0 0 20px;
  background:linear-gradient(180deg,var(--h1a) 35%,var(--h1b) 120%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--ink);
}
.sub{font-size:clamp(1.1rem,3.4vw,1.5rem); line-height:1.35; letter-spacing:-.018em; color:var(--muted); margin:0 auto; max-width:26em; font-weight:400}
.cta{margin-top:34px; display:flex; align-items:center; justify-content:center; gap:26px; flex-wrap:wrap}
.btn{
  display:inline-block; padding:12px 24px; border-radius:99px; background:var(--accent); color:#fff; text-decoration:none;
  font-size:1.02rem; font-weight:500; letter-spacing:-.01em; transition:background .25s ease, transform .4s var(--ease), box-shadow .4s var(--ease);
}
.btn:hover{background:var(--accent-hover); transform:scale(1.04); box-shadow:0 12px 26px -10px rgba(0,113,227,.6)}
.btn:active{transform:scale(.98)}
.link{color:var(--accent); text-decoration:none; font-size:1.02rem}
.link::after{content:"\203A"; display:inline-block; margin-left:6px; transition:transform .35s var(--ease)}
.link:hover::after{transform:translateX(5px)}
.link:hover{text-decoration:underline; text-underline-offset:4px}

/* hero entrance */
@keyframes blurin{from{opacity:0; transform:translateY(26px); filter:blur(10px)} to{opacity:1; transform:none; filter:blur(0)}}
.hero-in{animation:blurin 1.1s var(--ease) both; animation-delay:var(--d,0s)}

/* ---------- sections ---------- */
.sec{padding:96px 0}
.sec.alt{background:var(--alt-a); -webkit-backdrop-filter:blur(26px); backdrop-filter:blur(26px)}
.shead{margin-bottom:36px}
.eyebrow{margin:0 0 8px; font-size:.82rem; font-weight:600; letter-spacing:.02em; color:var(--muted); text-transform:uppercase; display:flex; align-items:center; gap:9px}
.eyebrow .dot{position:relative; width:8px; height:8px; border-radius:50%; background:#ff9f0a}
.eyebrow .dot::after{content:""; position:absolute; inset:0; border-radius:50%; background:#ff9f0a; animation:pulse 2.2s ease-out infinite}
@keyframes pulse{from{transform:scale(1); opacity:.7} to{transform:scale(3.2); opacity:0}}
h2{margin:0; font-size:clamp(2rem,6vw,3.2rem); line-height:1.07; letter-spacing:-.035em; font-weight:700}

/* scroll reveal */
.rv{opacity:0; transform:translateY(34px) scale(.985); transition:opacity 1s var(--ease) var(--d,0s), transform 1.1s var(--ease) var(--d,0s)}
.rv.in{opacity:1; transform:none}

/* ---------- theme toggle (sun / moon) ---------- */
.tt{
  position:fixed; z-index:60; top:max(14px,env(safe-area-inset-top,0px)); right:max(14px,env(safe-area-inset-right,0px));
  width:44px; height:44px; padding:0; border:0; border-radius:50%; cursor:pointer; color:var(--ink);
  background:var(--glass); -webkit-backdrop-filter:blur(18px) saturate(180%); backdrop-filter:blur(18px) saturate(180%);
  box-shadow:0 1px 3px rgba(0,0,0,.12), 0 8px 22px -10px rgba(0,0,0,.35);
  transition:transform .5s var(--ease), background .3s ease; -webkit-tap-highlight-color:transparent;
}
.tt:hover{transform:scale(1.1)}
.tt:active{transform:scale(.92)}
.tt:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.tt svg{position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; transition:transform .6s var(--ease), opacity .4s ease}
.tt .moon{opacity:1; transform:rotate(0) scale(1)}
.tt .sun{opacity:0; transform:rotate(-90deg) scale(.4)}
.tt[data-mode="dark"] .moon{opacity:0; transform:rotate(90deg) scale(.4)}
.tt[data-mode="dark"] .sun{opacity:1; transform:rotate(0) scale(1)}
html.theme-anim,html.theme-anim *{transition:background-color .5s ease, color .5s ease, border-color .5s ease, box-shadow .5s ease!important}

/* ---------- chapter cards ---------- */
.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:22px}
.cgrid>.rv{display:flex}
.ccard{
  flex:1; display:flex; flex-direction:column; padding:0; border:0; margin:0; text-align:left; font:inherit; color:inherit; cursor:pointer;
  background:var(--card); border-radius:26px; overflow:hidden; box-shadow:var(--shadow);
  transition:transform .6s var(--ease), box-shadow .6s var(--ease); -webkit-tap-highlight-color:transparent;
}
.ccard:hover{transform:translateY(-6px) scale(1.012); box-shadow:var(--shadow-hover)}
.ccard:active{transform:scale(.985)}
.ccard:focus-visible{outline:3px solid var(--focus); outline-offset:3px}
.cthumb{
  position:relative; display:block; aspect-ratio:16/10; overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--h1),82%,64%),hsl(var(--h2),78%,52%));
}
.cthumb b{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font:700 3.4rem/1 var(--font); letter-spacing:-.04em; color:rgba(255,255,255,.85); text-shadow:0 6px 24px rgba(0,0,0,.18);
}
.cimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s ease, transform 1.2s var(--ease)}
.cimg.in{opacity:1}
.ccard:hover .cimg{transform:scale(1.07)}
.cthumb::after{content:""; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.22),transparent 45%); pointer-events:none}
.cthumb.sm{width:60px; height:60px; flex:none; aspect-ratio:auto; border-radius:16px}
.cthumb.sm b{font-size:1.5rem}
.cbody{display:block; padding:16px 20px 20px}
.cname{display:block; font-size:1.15rem; font-weight:600; letter-spacing:-.02em; line-height:1.25}
.cmeta{display:block; margin-top:4px; font-size:.88rem; color:var(--muted)}
.cgo{display:block; margin-top:14px; color:var(--accent); font-size:.95rem; font-weight:500}
.cgo::after{content:"\203A"; display:inline-block; margin-left:6px; transition:transform .35s var(--ease)}
.ccard:hover .cgo::after{transform:translateX(5px)}

/* ---------- chapter pop-up ---------- */
html.lock{overflow:hidden}
.modal{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; visibility:hidden; pointer-events:none; transition:visibility 0s linear .5s}
.modal.open{visibility:visible; pointer-events:auto; transition-delay:0s}
.mback{position:absolute; inset:0; background:rgba(0,0,0,.42); -webkit-backdrop-filter:blur(14px) saturate(140%); backdrop-filter:blur(14px) saturate(140%); opacity:0; transition:opacity .45s ease}
.modal.open .mback{opacity:1}
.mpanel{
  position:relative; width:min(640px,100%); max-height:min(86vh,780px); display:flex; flex-direction:column;
  background:var(--card); border-radius:28px; overflow:hidden; box-shadow:0 30px 80px -20px rgba(0,0,0,.5);
  opacity:0; transform:translateY(34px) scale(.96); transition:opacity .4s ease, transform .6s var(--ease);
}
.modal.open .mpanel{opacity:1; transform:none}
.mpanel:focus{outline:none}
.mhead{display:flex; align-items:center; gap:16px; padding:20px 20px 18px 22px}
.mtext .eyebrow{margin:0 0 2px}
.mtext h3{margin:0; font-size:1.4rem; font-weight:700; letter-spacing:-.03em; line-height:1.15}
.mclose{
  margin-left:auto; flex:none; width:38px; height:38px; padding:0; border:0; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--muted); background:var(--chip);
  transition:background .3s ease, color .3s ease, transform .5s var(--ease); -webkit-tap-highlight-color:transparent;
}
.mclose:hover{background:var(--accent-soft); color:var(--accent); transform:rotate(90deg)}
.mclose:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.mbody{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
.mbody>.list{border-top:1px solid var(--hair)}

/* ---------- lessons (grouped list) ---------- */
.container{background:var(--card); border-radius:28px; overflow:hidden; box-shadow:var(--cshadow)}
details{display:block}
summary{
  list-style:none; cursor:pointer; display:flex; align-items:center; gap:16px; user-select:none;
  padding:22px 24px; font-size:1.3rem; font-weight:600; letter-spacing:-.025em;
  transition:background .3s ease; -webkit-tap-highlight-color:transparent;
}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--hover)}
summary:focus-visible,a:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--focus); outline-offset:-3px; border-radius:12px}
.count{margin-left:auto; flex:none; font-size:.88rem; font-weight:400; letter-spacing:0; color:var(--muted)}
.chev{
  flex:none; width:8px; height:8px; margin:0 6px 0 2px; border-right:2px solid var(--chev); border-bottom:2px solid var(--chev);
  transform:rotate(-45deg); transition:transform .5s var(--ease), border-color .3s ease;
}
.is-open>summary>.chev{transform:rotate(45deg); border-color:var(--accent)}
.list{border-top:1px solid var(--hair); padding-left:0}
.list.anim{overflow:hidden}
.list>*+*{border-top:1px solid var(--hair)}
.list .list{padding-left:22px; background:var(--nest)}
.list summary{font-size:1.06rem; padding:16px 22px 16px 24px; letter-spacing:-.02em}
.list .list summary{padding-left:22px}

/* iOS-style icon tiles */
.tile{
  display:flex; align-items:center; justify-content:center; flex:none; width:40px; height:40px; border-radius:11px; color:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.28); transition:transform .5s var(--ease);
}
.tile.folder{background:linear-gradient(180deg,#ffd15c,#ff9f0a)}
.tile.video{background:linear-gradient(180deg,#ff6961,#ff3b30)}
.tile.pdf{background:linear-gradient(180deg,#52a9ff,#0a6cff)}
.tile.image{background:linear-gradient(180deg,#5fe3a1,#1fb86a)}
.tile .ico-folder path{fill:rgba(255,255,255,.96); stroke:none}
summary:hover .tile,.item:hover .tile{transform:scale(1.1) rotate(-3deg)}
.list summary .tile{width:36px; height:36px; border-radius:10px}

.item{
  display:flex; align-items:center; gap:16px; padding:14px 24px; text-decoration:none; -webkit-tap-highlight-color:transparent;
  transition:background .3s ease;
}
.item:hover{background:var(--item-hover)}
.meta{display:block; min-width:0}
.item .t{display:block; font-size:1.04rem; font-weight:500; letter-spacing:-.018em}
.item .d{display:block; font-size:.86rem; color:var(--muted); letter-spacing:0}
.tag{margin-left:auto; flex:none; color:var(--accent); font-size:.95rem; font-weight:500; letter-spacing:-.01em; white-space:nowrap}
.tag::after{content:"\203A"; display:inline-block; margin-left:6px; transition:transform .35s var(--ease)}
.item:hover .tag::after{transform:translateX(5px)}
.empty{color:var(--muted); padding:14px 24px; font-style:italic}

footer{padding:34px 0 calc(40px + env(safe-area-inset-bottom,0px)); background:var(--alt-a); -webkit-backdrop-filter:blur(26px); backdrop-filter:blur(26px); border-top:1px solid var(--hair); text-align:center; color:var(--muted); font-size:.85rem}

@media (max-width:640px){
  body{font-size:16px}
  .sec{padding:68px 0}
  .hero{padding-top:calc(84px + env(safe-area-inset-top,0px)); padding-bottom:72px}
  .container{border-radius:24px}
  summary{padding:18px 18px; font-size:1.18rem; gap:13px}
  .list summary{padding:14px 16px 14px 18px}
  .item{padding:12px 18px; gap:13px}
  .list .list{padding-left:12px}
  .tile{width:36px; height:36px}
  .ccard{border-radius:22px}
  .modal{padding:0; align-items:flex-end}
  .mpanel{width:100%; max-height:88vh; border-radius:28px 28px 0 0; transform:translateY(100%) scale(1)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
  html{scroll-behavior:auto}
  .rv{opacity:1; transform:none}
  .cimg{opacity:1}
  .hero-in{opacity:1; filter:none; transform:none}
}
</style>
</head>
<body>

<button class="tt" id="themeBtn" type="button" aria-label="Switch to dark theme" data-mode="light">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
</button>

<header class="hero" id="top">
  <div class="wrap hero-inner" id="heroInner">
    <h1 class="hero-in">Sudarshan XII</h1>
    <p class="sub hero-in" style="--d:.15s">Class XII lectures and practice sheets, sorted by chapter.</p>
    <div class="cta hero-in" style="--d:.3s">
      <a class="btn" href="#chapters">Browse chapters</a>
    </div>
  </div>
</header>

<section id="chapters" class="sec alt">
  <div class="wrap">
    <div class="shead rv">
      <p class="eyebrow">Sudarshan XII</p>
      <h2>Chapters</h2>
    </div>
    <div class="cgrid" id="chapterGrid"></div>
  </div>
</section>

<footer>Tap a chapter to open it. Links open in a new tab.</footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="mback" id="mback"></div>
  <div class="mpanel" id="mpanel" role="dialog" aria-modal="true" aria-labelledby="mtitle" tabindex="-1">
    <div class="mhead">
      <span id="mthumb"></span>
      <div class="mtext"><p class="eyebrow">Chapter</p><h3 id="mtitle"></h3></div>
      <button class="mclose" id="mclose" type="button" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<script>
/* ===== EDIT HERE =====
   CHAPTERS: every chapter becomes a card on the page. Clicking a card opens a pop-up with its contents.
   - chapter: the name shown on the card
   - thumb:   the picture for the card. Upload the image to a folder called "thumbs" next to this page
              (for example thumbs/reflection-small.jpg) and write its path here. Best size: 800 x 500 px
              (16:10), JPG/PNG/WebP, under 200 KB. No picture? Leave "thumb" out and a coloured card
              with the first letter is shown.
   - items:   what is inside the chapter. It can hold
       { type: "folder", title: "Lecture 1", items: [ ... ] }   a folder (can be nested, any depth)
       { type: "video", title: "Video", note: "YouTube video", url: "..." }   a YouTube link
       { type: "pdf", title: "Class notes", note: "Notes (Drive)", url: "..." }   a Drive link (pdf or image)
     Put a comma between items. Replace the "#" links with your real links. */
var COURSE = [
  { chapter: "Reflection of Light", thumb: "thumbs/reflection.jpg", items: [
    { type: "folder", title: "Lecture 1", items: [
      { type: "video", title: "Video", note: "YouTube video", url: "https://youtu.be/4GzRQ4A-3u0" },
      { type: "pdf", title: "Class notes", note: "Notes (Drive)", url: "https://drive.google.com/file/d/1iaAXYprxoB3kdgb7r2hzPSJjoP4jyRmR/view?usp=drive_link" }
    ]},
     { type: "folder", title: "Lecture 2", items: [
      { type: "video", title: "Video", note: "YouTube video", url: "https://youtu.be/qpxE6bzIZlI" },
      { type: "pdf", title: "Class notes", note: "Notes (Drive)", url: "https://drive.google.com/file/d/1lMyygDiUJw07wrzxoes10EV5BFKZJuy9/view?usp=drive_link" }
    ]},
     { type: "folder", title: "Lecture 3 | Question Solve", items: [
      { type: "video", title: "Video", note: "YouTube video", url: "https://youtu.be/iQgGs0YINhs" },
      { type: "pdf", title: "Class notes", note: "Notes (Drive)", url: "https://drive.google.com/file/d/1vp6FReKYL1XAPoFuRv-Bi5JTgH-JO_qT/view?usp=drive_link" }
    ]}
  ]}
  /* To add a chapter, copy one block above and add a comma between them. */
];
/* ================================================================= */

var ICONS = {
  video: '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></svg>',
  pdf: '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5"/><path d="M9 13h7M9 17h7"/></svg>',
  image: '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>',
  folder: '<svg class="ico ico-folder" width="22" height="22" viewBox="0 0 24 24" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.5h8.4A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>'
};
var TAGS = { video: "Watch", pdf: "PDF", image: "Image" };

function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---- smooth open / close for folders ---- */
var EASE = "cubic-bezier(.22,.8,.24,1)";
var REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function wire(d){
  var sum = d.firstElementChild, box = d.lastElementChild;
  if(d.open) d.classList.add("is-open");
  sum.addEventListener("click", function(e){
    e.preventDefault();
    if(d._a){ d._a.cancel(); d._a = null; }
    var opening = !d.classList.contains("is-open");
    d.classList.toggle("is-open", opening);
    if(REDUCE || !box.animate){ d.open = opening; return; }
    box.classList.add("anim");
    var h;
    if(opening){
      d.open = true;
      h = box.offsetHeight;
      d._a = box.animate([{height:"0px", opacity:0},{height:h + "px", opacity:1}], {duration:520, easing:EASE});
    } else {
      h = box.offsetHeight;
      d._a = box.animate([{height:h + "px", opacity:1},{height:"0px", opacity:0}], {duration:400, easing:EASE});
    }
    var anim = d._a;
    anim.onfinish = function(){
      box.classList.remove("anim");
      if(!opening) d.open = false;
      if(d._a === anim) d._a = null;
    };
  });
}

function fillList(list, items, openFirstFolder){
  if(!items.length){ list.appendChild(el("div", "empty", "Nothing here yet.")); return; }
  var first = true;
  items.forEach(function(it){
    if(it.type === "folder"){ list.appendChild(build(it, openFirstFolder && first)); first = false; return; }
    var a = el("a", "item " + it.type,
      '<span class="tile ' + it.type + '">' + (ICONS[it.type] || ICONS.pdf) + '</span>' +
      '<span class="meta"><span class="t">' + esc(it.title) + '</span><span class="d">' + esc(it.note || "") + '</span></span>' +
      '<span class="tag">' + (TAGS[it.type] || "Open") + '</span>');
    a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    list.appendChild(a);
  });
}
function build(node, open){
  var d = el("details");
  if(open) d.open = true;
  var n = node.items.length;
  d.appendChild(el("summary", null,
    '<span class="tile folder">' + ICONS.folder + '</span><span>' + esc(node.title) + '</span>' +
    '<span class="count">' + n + (n === 1 ? " item" : " items") + '</span><span class="chev"></span>'));
  var list = el("div", "list");
  fillList(list, node.items, false);
  d.appendChild(list);
  wire(d);
  return d;
}
function countFiles(items){
  var n = 0;
  items.forEach(function(it){ n += it.type === "folder" ? countFiles(it.items) : 1; });
  return n;
}
function thumbMarkup(ch, small){
  var h1 = (ch._i * 47 + 205) % 360, h2 = (h1 + 45) % 360;
  var img = ch.thumb ? '<img class="cimg" src="' + esc(ch.thumb) + '" alt="" loading="eager" decoding="async"' + (!small && ch._i < 8 ? ' fetchpriority="high"' : '') + ' onload="this.classList.add(\'in\')" onerror="this.remove()">' : "";
  return '<span class="cthumb' + (small ? ' sm' : '') + '" style="--h1:' + h1 + ';--h2:' + h2 + '"><b>' + esc(String(ch.chapter).charAt(0)) + '</b>' + img + '</span>';
}

/* ---- chapter cards ---- */
var grid = document.getElementById("chapterGrid");
COURSE.forEach(function(ch, i){
  ch._i = i;
  var n = countFiles(ch.items);
  var wrap = el("div", "rv");
  wrap.style.setProperty("--d", (Math.min(i, 8) * 0.08) + "s");
  var b = el("button", "ccard",
    thumbMarkup(ch, false) +
    '<span class="cbody"><span class="cname">' + esc(ch.chapter) + '</span>' +
    '<span class="cmeta">' + n + (n === 1 ? " file" : " files") + '</span><span class="cgo">Open</span></span>');
  b.type = "button";
  b.addEventListener("click", function(){ openChapter(ch, b); });
  wrap.appendChild(b);
  grid.appendChild(wrap);
});

/* ---- chapter pop-up ---- */
var modal = document.getElementById("modal"), mpanel = document.getElementById("mpanel"),
    mbody = document.getElementById("mbody"), mclose = document.getElementById("mclose"), lastTrigger = null;

function openChapter(ch, trigger){
  lastTrigger = trigger;
  document.getElementById("mtitle").textContent = ch.chapter;
  document.getElementById("mthumb").innerHTML = thumbMarkup(ch, true);
  mbody.innerHTML = "";
  var list = el("div", "list");
  fillList(list, ch.items, false);
  mbody.appendChild(list);
  mbody.scrollTop = 0;
  var sw = window.innerWidth - document.documentElement.clientWidth;
  if(sw > 0) document.body.style.paddingRight = sw + "px";
  document.documentElement.classList.add("lock");
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  requestAnimationFrame(function(){ mclose.focus({ preventScroll: true }); });
}
function closeChapter(){
  if(!modal.classList.contains("open")) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.documentElement.classList.remove("lock");
  document.body.style.paddingRight = "";
  if(lastTrigger) lastTrigger.focus({ preventScroll: true });
}
mclose.addEventListener("click", closeChapter);
document.getElementById("mback").addEventListener("click", closeChapter);
document.addEventListener("keydown", function(e){
  if(!modal.classList.contains("open")) return;
  if(e.key === "Escape"){ closeChapter(); return; }
  if(e.key !== "Tab") return;
  var f = Array.prototype.filter.call(mpanel.querySelectorAll("a[href],button,summary"), function(x){ return x.offsetParent !== null; });
  if(!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if(e.shiftKey && (document.activeElement === first || document.activeElement === mpanel)){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ---- scroll reveal ---- */
var rvEls = document.querySelectorAll(".rv");
if("IntersectionObserver" in window && !REDUCE){
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
    });
  }, { threshold: 0.05, rootMargin: "0px 0px -6% 0px" });
  rvEls.forEach(function(n){ io.observe(n); });
} else {
  rvEls.forEach(function(n){ n.classList.add("in"); });
}

/* ---- hero parallax fade ---- */
var heroInner = document.getElementById("heroInner"), ticking = false;
function onScroll(){
  var y = window.scrollY || 0;
  if(!REDUCE && y < 900){
    heroInner.style.transform = "translate3d(0," + (y * 0.2) + "px,0) scale(" + (1 - Math.min(y, 600) / 5000) + ")";
    heroInner.style.opacity = Math.max(0, 1 - y / 560);
  }
  ticking = false;
}
window.addEventListener("scroll", function(){
  if(!ticking){ ticking = true; requestAnimationFrame(onScroll); }
}, { passive: true });
onScroll();

/* ---- sun / moon theme toggle ---- */
(function(){
  var btn = document.getElementById("themeBtn"), html = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function current(){ return html.getAttribute("data-theme") || (mq && mq.matches ? "dark" : "light"); }
  function sync(){
    var m = current();
    btn.setAttribute("data-mode", m);
    btn.setAttribute("aria-label", m === "dark" ? "Switch to light theme" : "Switch to dark theme");
  }
  btn.addEventListener("click", function(){
    var next = current() === "dark" ? "light" : "dark";
    if(!REDUCE){ html.classList.add("theme-anim"); setTimeout(function(){ html.classList.remove("theme-anim"); }, 650); }
    html.setAttribute("data-theme", next);
    try{ localStorage.setItem("theme", next); }catch(e){}
    sync();
  });
  if(mq){ var f = function(){ sync(); }; if(mq.addEventListener) mq.addEventListener("change", f); else if(mq.addListener) mq.addListener(f); }
  sync();
})();
</script>
